listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence false
log_dest stdout

# Burst handling: the defaults (20 in-flight, 1000 queued per client) made the broker
# drop messages for the ingest service during a load test. Allow a larger backlog so
# bursts are queued rather than lost.
max_inflight_messages 500
max_queued_messages 200000
